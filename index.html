<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced IoT Hydro-Station</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-water: #0ea5e9;
            --danger-water: #ef4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard {
            background: var(--panel-bg);
            max-width: 900px;
            width: 100%;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            padding: 35px;
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
        
        .status-badge {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 13px;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot { width: 8px; height: 8px; background: #38bdf8; border-radius: 50%; }

        .main-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
        }

        /* --- VISUAL WATER TANK DESIGNS (FIXED WAVE LOGIC) --- */
        .tanks-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            background: #111827;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #334155;
        }

        .tank-wrapper { text-align: center; }
        .tank-label { font-size: 14px; font-weight: 600; color: var(--text-muted); margin-bottom: 15px; }

        .glass-tank {
            position: relative;
            width: 120px;
            height: 200px;
            background: rgba(255, 255, 255, 0.02);
            border: 4px solid #475569;
            border-radius: 0 0 20px 20px;
            margin: 0 auto;
            overflow: hidden; /* Clips the rotating square mask safely inside the tank */
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        /* The container holding the water level */
        .liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%; /* Regulated by Javascript variables */
            background-color: #0284c7;
            transition: height 1s ease-out;
        }

        /* Spinning wave canvas mask trick */
        .liquid::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: #111827; /* Must match container background perfectly */
            left: 50%;
            bottom: 100%; /* Sits exactly on the surface line */
            transform: translate(-50%, 20%); /* Slightly offset down into the blue space */
            border-radius: 42%; /* Uneven corners make a wavy movement */
            animation: waveMotion 7s linear infinite;
            z-index: 5;
        }

        /* Duplicate shifting overlay for fluid depth realism */
        .liquid::after {
            content: "";
            position: absolute;
            width: 290px;
            height: 290px;
            background: rgba(2, 132, 199, 0.4);
            left: 50%;
            bottom: 100%;
            transform: translate(-50%, 15%);
            border-radius: 40%;
            animation: waveMotion 4s linear infinite;
            z-index: 2;
        }

        .tank-percentage { font-size: 28px; font-weight: 700; margin-top: 15px; color: var(--text-main); }

        /* Danger states if water levels drop below 15% */
        .tank-wrapper.danger .liquid { background-color: #dc2626; }
        .tank-wrapper.danger .liquid::after { background: rgba(220, 38, 38, 0.4); }
        .tank-wrapper.danger .tank-percentage { color: #f87171; }

        /* --- RIGHT SIDE PANELS --- */
        .side-panel { display: flex; flex-direction: column; gap: 20px; }

        .metric-card {
            background: #111827;
            border: 1px solid #334155;
            padding: 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .metric-info h3 { margin: 0; font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .metric-info p { margin: 5px 0 0 0; font-size: 32px; font-weight: bold; }
        
        .temp-txt { color: #f87171; }
        .hum-txt { color: #60a5fa; }

        .control-card {
            background: #111827;
            border: 1px solid #334155;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            margin-top: auto;
        }

        .led-btn {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .led-btn.on { background: #10b981; color: #fff; box-shadow: 0 0 20px rgba(16,185,129,0.4); }
        .led-btn.off { background: #475569; color: #cbd5e1; }
        .led-btn:active { transform: scale(0.98); }

        /* CONSTANT ROTATION WAVE ENGINE */
        @keyframes waveMotion {
            0% { transform: translate(-50%, 15%) rotate(0deg); }
            100% { transform: translate(-50%, 15%) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <header>
            <div>
                <h1>TechWarriors Hydro-Monitor</h1>
            </div>
            <div class="status-badge">
                <div class="status-dot"></div>
                <span id="status-text">System Synced</span>
            </div>
        </header>

        <div class="main-grid">
            <div class="tanks-container">
                <div id="tank1-wrapper" class="tank-wrapper">
                    <div class="tank-label">Reservoir Tank A</div>
                    <div class="glass-tank">
                        <div id="liquid1" class="liquid"></div>
                    </div>
                    <div id="pct1" class="tank-percentage">0%</div>
                </div>

                <div id="tank2-wrapper" class="tank-wrapper">
                    <div class="tank-label">Supply Tank B</div>
                    <div class="glass-tank">
                        <div id="liquid2" class="liquid"></div>
                    </div>
                    <div id="pct2" class="tank-percentage">0%</div>
                </div>
            </div>

            <div class="side-panel">
                <div class="metric-card">
                    <div class="metric-info">
                        <h3>Ambient Temperature</h3>
                        <p id="temp-val" class="temp-txt">--°C</p>
                    </div>
                </div>

                <div class="metric-card">
                    <div class="metric-info">
                        <h3>Relative Humidity</h3>
                        <p id="hum-val" class="hum-txt">--%</p>
                    </div>
                </div>

                <div class="control-card">
                    <h3 style="margin:0 0 15px 0; font-size:13px; color:var(--text-muted); text-transform:uppercase;">Hardware Actuator</h3>
                    <button id="led-btn" class="off">LED IS OFF</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://dxalgqtgylopgjgptaou.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR4YWxncXRneWxvcGdqZ3B0YW91Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDgwODAsImV4cCI6MjA5NjU4NDA4MH0.ClONYDUguhlClVMzliqpqEAHBCefCtC2isgE5LeKwVE";
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const liquid1 = document.getElementById('liquid1');
        const liquid2 = document.getElementById('liquid2');
        const pct1 = document.getElementById('pct1');
        const pct2 = document.getElementById('pct2');
        const tank1Wrap = document.getElementById('tank1-wrapper');
        const tank2Wrap = document.getElementById('tank2-wrapper');
        
        const tempVal = document.getElementById('temp-val');
        const humVal = document.getElementById('hum-val');
        const ledBtn = document.getElementById('led-btn');
        const statusText = document.getElementById('status-text');

        let currentLedStatus = "OFF";

        function updateTelemetryDashboard(temperature, humidity, w1, w2) {
            tempVal.textContent = `${temperature.toFixed(1)}°C`;
            humVal.textContent = `${humidity.toFixed(0)}%`;
            pct1.textContent = `${w1}%`;
            pct2.textContent = `${w2}%`;

            // Adjust fluid heights
            liquid1.style.height = `${w1}%`;
            liquid2.style.height = `${w2}%`;

            // Change color scheme if water gets low (under 15%)
            if (w1 <= 15) tank1Wrap.classList.add('danger');
            else tank1Wrap.classList.remove('danger');

            if (w2 <= 15) tank2Wrap.classList.add('danger');
            else tank2Wrap.classList.remove('danger');
        }

        function updateButtonUI(status) {
            currentLedStatus = status;
            ledBtn.textContent = `LED IS ${status}`;
            ledBtn.className = `led-btn ${status.toLowerCase()}`;
        }

        async function initializeConnectionStreams() {
            statusText.textContent = "Fetching snapshots...";
            
            let { data: sensorRows } = await supabaseClient.from('sensor_data').select('*').order('id', { ascending: false }).limit(1);
            if (sensorRows && sensorRows.length > 0) {
                updateTelemetryDashboard(sensorRows.temperature, sensorRows.humidity, sensorRows.water_level_1 || 0, sensorRows.water_level_2 || 0);
            }

            let { data: controlRow } = await supabaseClient.from('device_controls').select('status').eq('device_name', 'esp32_led').single();
            if (controlRow) updateButtonUI(controlRow.status);
            
            statusText.textContent = "Live Stream Active";
        }

        ledBtn.addEventListener('click', async () => {
            const nextState = (currentLedStatus === "ON") ? "OFF" : "ON";
            statusText.textContent = "Sending override...";
            await supabaseClient.from('device_controls').update({ status: nextState }).eq('device_name', 'esp32_led');
        });

        supabaseClient
            .channel('live-telemetry')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'sensor_data' }, payload => {
                updateTelemetryDashboard(payload.new.temperature, payload.new.humidity, payload.new.water_level_1 || 0, payload.new.water_level_2 || 0);
                statusText.textContent = "Data Pack Received";
                setTimeout(() => { statusText.textContent = "Live Stream Active"; }, 1500);
            })
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'device_controls' }, payload => {
                if (payload.new.device_name === 'esp32_led') {
                    updateButtonUI(payload.new.status);
                    statusText.textContent = `Actuator set: ${payload.new.status}`;
                    setTimeout(() => { statusText.textContent = "Live Stream Active"; }, 1500);
                }
            })
            .subscribe((status) => {
                if (status === 'SUBSCRIBED') initializeConnectionStreams();
            });
    </script>
</body>
</html>
