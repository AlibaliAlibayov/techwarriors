<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Control Station</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .dashboard { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; max-width: 450px; width: 100%; }
        h1 { color: #1e293b; margin-bottom: 25px; font-size: 24px; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .card { background: #f8fafc; padding: 15px; border-radius: 10px; border: 1px solid #e2e8f0; }
        .card h2 { font-size: 11px; color: #64748b; text-transform: uppercase; margin: 0 0 8px 0; }
        .value { font-size: 24px; font-weight: bold; color: #0f172a; }
        .temp-color { color: #ef4444; }
        .hum-color { color: #3b82f6; }
        .water-color { color: #06b6d4; }
        .control-panel { border-top: 1px solid #e2e8f0; padding-top: 25px; }
        .led-btn { padding: 15px 30px; font-size: 16px; font-weight: 600; cursor: pointer; border: none; border-radius: 8px; width: 100%; transition: 0.2s ease; }
        .on { background-color: #10b981; color: white; box-shadow: 0 4px 12px rgba(16,185,129,0.2); }
        .off { background-color: #64748b; color: white; }
        .status { margin-top: 20px; font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="dashboard">
        <h1>TechWarriors IoT Station</h1>
        
        <div class="grid-container">
            <div class="card">
                <h2>Temperature</h2>
                <div id="temp" class="value temp-color">--°C</div>
            </div>
            <div class="card">
                <h2>Humidity</h2>
                <div id="hum" class="value hum-color">--%</div>
            </div>
            <div class="card">
                <h2>Water Level 1</h2>
                <div id="w1" class="value water-color">--%</div>
            </div>
            <div class="card">
                <h2>Water Level 2</h2>
                <div id="w2" class="value water-color">--%</div>
            </div>
        </div>

        <div class="control-panel">
            <button id="led-btn" class="off">LED IS OFF</button>
        </div>

        <div id="status" class="status">Connecting to network Engine...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://dxalgqtgylopgjgptaou.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR4YWxncXRneWxvcGdqZ3B0YW91Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDgwODAsImV4cCI6MjA5NjU4NDA4MH0.ClONYDUguhlClVMzliqpqEAHBCefCtC2isgE5LeKwVE";
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const tempEl = document.getElementById('temp');
        const humEl = document.getElementById('hum');
        const w1El = document.getElementById('w1');
        const w2El = document.getElementById('w2');
        const ledBtn = document.getElementById('led-btn');
        const statusEl = document.getElementById('status');
        
        let currentLedStatus = "OFF";

        function updateUI(temperature, humidity, w1, w2) {
            tempEl.textContent = `${temperature.toFixed(1)}°C`;
            humEl.textContent = `${humidity.toFixed(1)}%`;
            w1El.textContent = `${w1}%`;
            w2El.textContent = `${w2}%`;
        }

        function updateButtonUI(status) {
            currentLedStatus = status;
            ledBtn.textContent = `LED IS ${status}`;
            ledBtn.className = `led-btn ${status.toLowerCase()}`;
        }

        async function loadInitialData() {
            let { data: sensorData } = await supabaseClient.from('sensor_data').select('*').order('id', { ascending: false }).limit(1);
            if (sensorData && sensorData.length > 0) {
                updateUI(sensorData.temperature, sensorData.humidity, sensorData.water_level_1 || 0, sensorData.water_level_2 || 0);
            }

            let { data: controlData } = await supabaseClient.from('device_controls').select('status').eq('device_name', 'esp32_led').single();
            if (controlData) updateButtonUI(controlData.status);
            
            statusEl.textContent = "Telemetry engine sync complete.";
        }

        ledBtn.addEventListener('click', async () => {
            const targetStatus = (currentLedStatus === "ON") ? "OFF" : "ON";
            statusEl.textContent = "Broadcasting switch event...";
            await supabaseClient.from('device_controls').update({ status: targetStatus }).eq('device_name', 'esp32_led');
        });

        supabaseClient
            .channel('iot-sync')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'sensor_data' }, payload => {
                updateUI(payload.new.temperature, payload.new.humidity, payload.new.water_level_1 || 0, payload.new.water_level_2 || 0);
                statusEl.textContent = "New telemetry stream received.";
            })
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'device_controls' }, payload => {
                if (payload.new.device_name === 'esp32_led') {
                    updateButtonUI(payload.new.status);
                    statusEl.textContent = `LED set to ${payload.new.status}`;
                }
            })
            .subscribe((status) => {
                if (status === 'SUBSCRIBED') loadInitialData();
            });
    </script>
</body>
</html>
